<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ember · огонь C — угли в 3D + bloom</title><meta name="robots" content="noindex">
<style>html,body{margin:0;height:100%;background:#050403;overflow:hidden}canvas{position:fixed;inset:0}
h1{position:fixed;left:6vw;bottom:14vh;margin:0;font:300 clamp(48px,8vw,116px)/1 Georgia,serif;color:#fff6ed;z-index:2}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head>
<body><h1>Кухня<br>живого огня</h1>
<script type="module">
// Мок C: настоящая куча углей — 140 кусков неправильной формы (икосаэдры с шумовым смещением),
// трещины светятся изнутри (эмиссия по шуму на поверхности, мерцает по-своему у каждого куска), Bloom даёт ореол,
// тёплый точечный свет «дышит», искры поднимаются. Камера медленно облетает кучу, как в шаблоне Laocoön.
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
const R = new THREE.WebGLRenderer({ antialias: true }); R.setPixelRatio(Math.min(devicePixelRatio, 1.5)); R.setSize(innerWidth, innerHeight);
R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.1; document.body.prepend(R.domElement);
const S = new THREE.Scene(); S.background = new THREE.Color('#050403'); S.fog = new THREE.FogExp2('#050403', .18);
const C = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, .1, 50); C.position.set(0, 1.6, 3.4);
const U = { uT: { value: 0 } };
const mat = new THREE.MeshStandardMaterial({ color: '#1a1412', roughness: .95, metalness: 0 });
mat.onBeforeCompile = sh => { // эмиссия трещин в зависимости от мирового положения и времени
  sh.uniforms.uT = U.uT;
  sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vW;\nattribute float aSeed;varying float vSeed;')
    .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvW=(modelMatrix*instanceMatrix*vec4(transformed,1.)).xyz;vSeed=aSeed;');
  sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
uniform float uT;varying vec3 vW;varying float vSeed;
float h3(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
float n3(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+1.),f.x),f.y),f.z);}`)
    .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
float cr=abs(n3(vW*9.+vSeed*10.)-.5);float crack=smoothstep(.07,.0,cr);
float fl=.55+.45*sin(uT*(1.+vSeed*2.)+vSeed*40.);float under=smoothstep(.35,-.1,vW.y);
float heat=(crack*.9+under*.35)*fl;
totalEmissiveRadiance+=mix(vec3(.7,.08,.0),vec3(1.,.55,.15),heat)*heat*2.4;`);
};
const geo = new THREE.IcosahedronGeometry(.16, 2), p = geo.attributes.position;
for (let i = 0; i < p.count; i++) { const v = new THREE.Vector3().fromBufferAttribute(p, i); v.multiplyScalar(.75 + Math.random() * .45); p.setXYZ(i, v.x, v.y * .7, v.z); }
geo.computeVertexNormals();
const N = innerWidth < 861 ? 90 : 140, seeds = new Float32Array(N);
const coals = new THREE.InstancedMesh(geo, mat, N), m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
for (let i = 0; i < N; i++) {
  const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * 1.15;
  e.set(Math.random() * 3, Math.random() * 3, Math.random() * 3); q.setFromEuler(e);
  const s = .7 + Math.random() * .8;
  m.compose(new THREE.Vector3(Math.cos(a) * r, (1.2 - r) * .18 + Math.random() * .12, Math.sin(a) * r), q, new THREE.Vector3(s, s, s));
  coals.setMatrixAt(i, m); seeds[i] = Math.random();
}
geo.setAttribute('aSeed', new THREE.InstancedBufferAttribute(seeds, 1));
S.add(coals);
const glow = new THREE.PointLight('#ff6a1f', 6, 4, 1.6); glow.position.set(0, .35, 0); S.add(glow);
S.add(new THREE.HemisphereLight('#3a2418', '#000000', .4));
// искры
const SN = 260, sp = new Float32Array(SN * 3), sv = [];
for (let i = 0; i < SN; i++) { sp.set([(Math.random() - .5) * 2, Math.random() * 2.5, (Math.random() - .5) * 2], i * 3); sv.push(.3 + Math.random() * .6); }
const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
S.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: '#ffb36b', size: .02, transparent: true, opacity: .9, blending: THREE.AdditiveBlending, depthWrite: false })));
const comp = new EffectComposer(R); comp.addPass(new RenderPass(S, C));
comp.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.15, .6, .18));
addEventListener('resize', () => { C.aspect = innerWidth / innerHeight; C.updateProjectionMatrix(); R.setSize(innerWidth, innerHeight); comp.setSize(innerWidth, innerHeight); });
const clock = new THREE.Clock();
R.setAnimationLoop(() => {
  const t = clock.getElapsedTime(), dt = Math.min(clock.getDelta(), .05) || .016; U.uT.value = t;
  glow.intensity = 5 + Math.sin(t * 3.1) * .8 + Math.sin(t * 7.3) * .5;
  const a = sg.attributes.position.array;
  for (let i = 0; i < SN; i++) { const k = i * 3; a[k + 1] += sv[i] * .016; a[k] += Math.sin(t * 2 + i) * .002; if (a[k + 1] > 2.6) { a[k + 1] = .1; a[k] = (Math.random() - .5) * 1.6; a[k + 2] = (Math.random() - .5) * 1.6; } }
  sg.attributes.position.needsUpdate = true;
  C.position.set(Math.sin(t * .08) * 3.4, 1.6, Math.cos(t * .08) * 3.4); C.lookAt(0, .15, 0);
  comp.render();
});
</script></body></html>
