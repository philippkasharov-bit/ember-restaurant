<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ember · огонь A — процедурное пламя</title><meta name="robots" content="noindex">
<style>html,body{margin:0;height:100%;background:#050403;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%}
h1{position:fixed;left:6vw;bottom:14vh;margin:0;font:300 clamp(48px,8vw,116px)/1 Georgia,serif;color:#fff6ed;z-index:2}</style></head>
<body><canvas id="c"></canvas><h1>Кухня<br>живого огня</h1>
<script>
// Мок A: пламя целиком в шейдере — fBm + двойной domain warp, чёрнотельная палитра, языки вверх, марево над огнём.
const c = document.getElementById('c'), gl = c.getContext('webgl');
const fs = `precision highp float;uniform vec2 R;uniform float T;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return v;}
vec3 ramp(float t){return clamp(vec3(1.5*t,1.5*t*t*1.1-.15,pow(max(t-.55,0.),2.)*3.),0.,1.2);} // чёрное тело: красный → оранжевый → жёлто-белый
void main(){
 vec2 uv=gl_FragCoord.xy/R;vec2 p=vec2((uv.x-.5)*R.x/R.y,uv.y);
 float t=T*.9;
 vec2 q=vec2(fbm(p*2.2+vec2(0.,-t*1.6)),fbm(p*2.2+vec2(5.2,-t*1.9)));
 vec2 r=vec2(fbm(p*2.6+q*1.6+vec2(1.7,-t*2.4)),fbm(p*2.6+q*1.6+vec2(8.3,-t*2.1)));
 float f=fbm(p*3.+r*1.8-vec2(0.,t*2.8));
 float base=smoothstep(.55,.0,uv.y);                         // жар у основания, гаснет кверху
 float tongues=f*1.5-uv.y*1.9+base*.35;                       // рваные языки, ниже и тоньше
 float heat=smoothstep(.22,1.05,tongues)*.85;
 vec3 col=ramp(heat)*heat;
 col+=vec3(.9,.25,.04)*pow(base,3.)*.35*(.7+.3*n(vec2(p.x*6.,t*3.)));  // угли у самого низа
 gl_FragColor=vec4(col,1.);
}`;
const vs = 'attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}';
const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; };
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr); gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const uR = gl.getUniformLocation(pr, 'R'), uT = gl.getUniformLocation(pr, 'T');
const scale = innerWidth < 861 ? .5 : .75; // полразрешения на телефоне — пламя мягкое, апскейл не виден
const fit = () => { c.width = innerWidth * scale; c.height = innerHeight * scale; gl.viewport(0, 0, c.width, c.height); };
fit(); addEventListener('resize', fit);
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const draw = now => { gl.uniform2f(uR, c.width, c.height); gl.uniform1f(uT, still ? 4.0 : now / 1000); gl.drawArrays(gl.TRIANGLES, 0, 3); if (!still) requestAnimationFrame(draw); };
requestAnimationFrame(draw);
</script></body></html>
