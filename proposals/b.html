<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMBER · B — Тетрадь шефа</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Spectral:ital,wght@0,400;1,400&family=IBM+Plex+Sans+Condensed:wght@400;500&display=swap" rel="stylesheet">
<style>
/* B · «Тетрадь шефа»: дневной печатный журнал на бумаге — против клише тёмного стейкхауса */
:root{--paper:#f1ebe0;--ink:#191613;--graphite:#5e564c;--rule:#d6ccbb;--wax:#8c2a17;
 --display:'Prata',Georgia,serif;--text:'Spectral',Georgia,serif;--cap:'IBM Plex Sans Condensed',sans-serif;--pad:clamp(18px,3.4vw,56px)}
*{margin:0;box-sizing:border-box}
html{background:var(--paper);color:var(--ink)}
body{font:400 18px/1.55 var(--text);-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit}img,video{display:block;max-width:100%}
::selection{background:var(--wax);color:var(--paper)}
:focus-visible{outline:2px solid var(--wax);outline-offset:3px}
.cap{font-family:var(--cap);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.mast{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:24px;padding:18px var(--pad);border-bottom:1px solid var(--ink)}
.mast .logo{font-family:var(--display);font-size:clamp(22px,2vw,30px);letter-spacing:.32em;text-decoration:none}
.mast nav{display:flex;gap:26px;justify-self:end}.mast nav a{text-decoration:none;color:var(--graphite)}.mast nav a:hover{color:var(--ink)}
.spread{display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--pad);padding:clamp(28px,3.6vw,56px) var(--pad) clamp(40px,5vw,72px);min-height:calc(100svh - 62px)}
.lede{grid-column:1/6;display:flex;flex-direction:column;justify-content:space-between;gap:36px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(58px,8vw,138px);line-height:.9;letter-spacing:-.025em}
h1 em{font-family:var(--text);font-style:italic;color:var(--wax);letter-spacing:-.02em}
.dek{max-width:34ch;font-size:clamp(18px,1.4vw,21px)}
.dek::first-letter{float:left;font-family:var(--display);font-size:4.1em;line-height:.8;margin:.06em .1em 0 0;color:var(--wax)}
.sign{display:flex;justify-content:space-between;align-items:end;gap:16px;border-top:1px solid var(--rule);padding-top:14px;color:var(--graphite)}
.book{display:inline-flex;align-items:center;gap:12px;min-height:48px;padding:0 4px;border-bottom:2px solid var(--wax);color:var(--ink);text-decoration:none;font-family:var(--cap);font-weight:500;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.book:hover{color:var(--wax)}
.plates{grid-column:6/-1;position:relative;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:1fr auto}
.cover{grid-column:2/-1;grid-row:1;position:relative;margin-right:calc(-1*var(--pad));overflow:hidden;background:#d9cfbf}
.cover img{width:100%;height:100%;object-fit:cover;object-position:60% 50%;clip-path:inset(var(--c,6%) 0 0 var(--c,6%));transition:clip-path 1.6s cubic-bezier(.2,.8,.1,1)}
.strip{grid-column:1/3;grid-row:1;align-self:end;position:relative;z-index:2;margin-bottom:-28px;aspect-ratio:9/16;overflow:hidden;border:10px solid var(--paper);background:#2a1f16}
.strip video,.strip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.plates figcaption{grid-column:3/-1;grid-row:2;display:flex;justify-content:space-between;gap:16px;padding-top:14px;color:var(--graphite)}
.folio{position:absolute;right:calc(-1*var(--pad) + 12px);top:12px;writing-mode:vertical-rl;color:var(--paper);mix-blend-mode:difference}
@media(max-width:860px){
 .mast{grid-template-columns:1fr auto}.mast>.cap:first-child{display:none}.mast nav{display:none}
 .mast::after{content:"Меню";font-family:var(--cap);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
 .spread{grid-template-columns:1fr;row-gap:28px}
 .plates{grid-column:1;order:-1;grid-template-columns:repeat(6,1fr);height:58svh}
 .cover{grid-column:2/-1;margin-right:calc(-1*var(--pad))}.strip{grid-column:1/3;margin-bottom:-20px;border-width:6px}
 .lede{grid-column:1}
}
@media(prefers-reduced-motion:reduce){.cover img{transition:none}}
</style>
</head>
<body>
<header class="mast">
 <span class="cap">Сезонная тетрадь · осень 2026</span>
 <a class="logo" href="#">EMBER</a>
 <nav class="cap" aria-label="Разделы"><a href="#">Меню</a><a href="#">Шеф</a><a href="#">События</a><a href="#">Бронь</a></nav>
</header>
<main>
<section class="spread">
 <div class="lede">
  <h1>Огонь, вишня <em>и&nbsp;дуб</em></h1>
  <p class="dek">Каждое утро печь разогревается четыре часа, прежде чем на решётку ляжет первый стейк. Ни газа, ни плит — только дрова, угли и сезонное меню от шефа.</p>
  <div class="sign"><span class="cap">Москва, Пятницкая 18 · с 2019</span><a class="book" href="#">Забронировать стол</a></div>
 </div>
 <figure class="plates">
  <div class="cover"><img src="../hero.jpg" alt="Стейк на решётке над открытым огнём, летят искры"><span class="folio cap" aria-hidden="true">Рибай на вишнёвых углях</span></div>
  <div class="strip" aria-hidden="true"><img src="../f-flare.jpg" alt=""><video muted loop playsinline preload="none" data-src="../media/flare-steak-sm"></video></div>
  <figcaption class="cap"><span>Кухня у открытого огня</span><span>Фото: EMBER</span></figcaption>
 </figure>
</section>
</main>
<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) document.querySelectorAll('video[data-src]').forEach(v => {
    const b = v.dataset.src; v.loop = true;
    v.innerHTML = `<source src="${b}.av1.mp4" type='video/mp4; codecs="av01.0.08M.10"'><source src="${b}.mp4" type="video/mp4">`;
    v.load(); v.play().catch(() => {});
  });
  // кадрирование раскрывается: вставка «под паспарту» становится полосой на вылет
  const img = document.querySelector('.cover img');
  addEventListener('scroll', () => img.style.setProperty('--c', Math.max(0, 6 - scrollY / 40) + '%'), { passive: true });
  if (!reduce) requestAnimationFrame(() => img.style.setProperty('--c', '3%'));
})();
</script>
</body>
</html>
